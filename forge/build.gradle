plugins {
    id "net.minecraftforge.gradle" version("[7.0.29,8.0)")
    id 'net.minecraftforge.jarjar' version '0.2.3'
}
base {
    archivesName = "${project.tesseract_archive_base_name}-forge"
}

minecraft {
    mappings channel: "parchment", version: project.mappings_version
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')

            //systemProperty 'forge.logging.markers', 'REGISTRIES'

            systemProperty 'forge.logging.console.level', 'debug'

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'

            //args "-mixin.config=${mod_id}.mixins.json"
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

jarJar.register() {
    archiveClassifier = null
}

repositories {
    maven fg.forgeMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    implementation("org.jetbrains:annotations:26.0.1")
    compileOnly(project(":tesseract-common"))
    compileOnly(project(":tesseract-graph"))
    testImplementation('junit:junit:4.13.1')
}

tasks.named('compileJava', JavaCompile) {
    source(project(":tesseract-common").sourceSets.main.allSource)
    source(project(":tesseract-graph").sourceSets.main.allSource)
}

processResources {
    from project(":tesseract-common").sourceSets.main.resources
    from project(":tesseract-graph").sourceSets.main.resources
    inputs.property "version", project.mod_version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.mod_version
    }
}

sourcesJar {
    from(project(':tesseract-common').sourceSets.main.allSource)
    from(project(':tesseract-graph').sourceSets.main.allSource)
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : "GT Reimagined",
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : "GT Reimagined",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    archiveClassifier = "slim"
}

publishing {
    publications.register('mavenJava', MavenPublication) {
        artifact tasks.named("jar")
        artifact tasks.named("jarJar")
    }

    repositories {
        def isCI = System.getenv("CI")
        if (isCI) {
            maven {
                url System.getenv("local_maven_url")
            }
        } else {
            mavenLocal()
        }
    }
}
